version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: skalway_pharm_backend
    restart: always
    env_file:
      - ./.env
    environment:
      TZ: Africa/Maputo
      PRISMA_CLIENT_ENGINE_TYPE: binary
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_TENANT: ${DATABASE_URL_TENANT}
      TENANT_DB_HOST: ${TENANT_DB_HOST}
      TENANT_DB_PORT: ${TENANT_DB_PORT}
      TENANT_DB_USERNAME: ${TENANT_DB_USERNAME}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      PORT: ${BACKEND_PORT:-3300}
    ports:
      - "${BACKEND_PORT:-3300}:3300"
    command: ["bun", "run", "start"]
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      mysql_central:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - skalway_pharm_net

  backend_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: skalway_pharm_backend_worker
    restart: always
    env_file:
      - ./.env
    environment:
      TZ: Africa/Maputo
      PRISMA_CLIENT_ENGINE_TYPE: binary
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    command: ["bun", "run", "worker"]
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      mysql_central:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - skalway_pharm_net

  nginx:
    image: nginx:alpine
    container_name: skalway_pharm_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8280}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/http/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
    networks:
      - skalway_pharm_net

  mysql_central:
    image: mysql:8.0
    container_name: skalway_pharm_mysql
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Africa/Maputo
    command: --default-time-zone="Africa/Maputo"
    ports:
      - "${MYSQL_EXPOSED_PORT:-3312}:3306"
    volumes:
      - skalway_pharm_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - skalway_pharm_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skalway_pharm_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - skalway_pharm_net

  adminer:
    image: phpmyadmin/phpmyadmin
    container_name: skalway_pharm_phpmyadmin
    restart: always
    env_file:
      - ./.env
    environment:
      PMA_HOST: mysql_central
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Africa/Maputo
    ports:
      - "${PHPMYADMIN_PORT:-8686}:80"
    networks:
      - skalway_pharm_net

networks:
  skalway_pharm_net:

volumes:
  skalway_pharm_mysql_data:
